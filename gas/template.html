<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GAS</title>
<!-- this project's own setup: title, program, resources, and now its
     palette choice too - see gas/README.md for the shape config.js needs.
     Loaded here rather than near app.js at the very end of body (the usual
     spot for a project's own script, and where this used to sit) purely so
     the bootstrap script right after can read GAS_CONFIG.palette before
     anything paints - it doesn't touch the DOM, so nothing is lost moving
     it this early. -->
<script src="config.js"></script>
<!-- which palette/theme applies, resolved synchronously before anything
     paints: without this, the page would render once with neither
     data-palette nor data-theme set at all (every palette file is scoped
     to one or the other, on purpose - see assets/palettes/), then visibly
     jump the moment something further down the page got around to it.
     Palette is a project setting now, not a personal one - the editor's
     own picker (?mode=edit, app.js) writes it straight into config.js
     (GAS_CONFIG.palette) via dev.py's /api/source, same as any other Edit
     source save - so every viewer of the built site gets the same one,
     read here. Theme (light/dark) stays a personal, per-viewer choice: a
     stored pick, else the OS's own preference, same as before. Always ends
     by actually setting both attributes no matter what: a blocked
     localStorage (a private window, a strict browser setting) only ever
     costs the stored theme choice, never leaves the page with no palette
     or theme set at all. -->
<script>
(function () {
  var palette = (window.GAS_CONFIG && window.GAS_CONFIG.palette) || "claude";
  var theme = "light";
  try {
    theme = localStorage.getItem("gas-theme") ||
      (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : theme);
  } catch (err) {
    // localStorage blocked - the light default above stands
  }
  document.documentElement.dataset.palette = palette;
  document.documentElement.dataset.theme = theme;
})();
</script>
<!-- a generic default - a project's config.js can override it (see
     gas/README.md); this is what shows before that script runs, and if
     a project sets none -->
<link id="favicon" rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='5' y='4.5' width='22' height='23' rx='3' fill='none' stroke='%23888' stroke-width='2.4'/%3E%3Cpath d='M10 12h12M10 16h12M10 20h7' stroke='%23888' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<!-- one per gas/assets/palettes/*.css file, computed at build time - see
     gas/build.py's discover_palettes() and gas/README.md -->
<!-- build:palettes -->
<link rel="stylesheet" href="{{gas}}/assets/style.css">
<!-- optional: a project's own tweaks, e.g. styling for one of its own
     plain pages (see gas/README.md) - a project with none of its own
     just 404s here, harmlessly -->
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="sidebar" id="sidebar">
  <div class="sidebar-head">
    <h1><button class="home" id="home">GAS</button></h1>
    <!-- light/dark is the one personal, per-viewer choice (a stored pick,
         else the OS's own preference) - the palette itself is a project
         setting now, picked from the editor panel instead (?mode=edit),
         which writes it into config.js - see that panel, further down.
         Kept small and quiet, next to the collapse toggle it shares this
         row with, rather than a whole row of its own further down - it's
         not something most viewers need to think about twice. -->
    <button type="button" id="theme-toggle" title="Switch light/dark" aria-label="Switch light/dark theme">
      <svg class="icon-sun" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor"
           stroke-width="1.4" stroke-linecap="round" aria-hidden="true">
        <circle cx="8" cy="8" r="3"/>
        <path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.2 3.2l1.4 1.4M11.4 11.4l1.4 1.4M12.8 3.2l-1.4 1.4M4.6 11.4l-1.4 1.4"/>
      </svg>
      <svg class="icon-moon" width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
        <path d="M13.5 8.9A5.6 5.6 0 0 1 6.6 2 6 6 0 1 0 13.5 8.9Z"/>
      </svg>
    </button>
    <button class="sidebar-toggle" id="sidebar-toggle" type="button"
            title="Collapse menu (m)" aria-label="Collapse menu" aria-expanded="true">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor"
           stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M10.5 3.5 5.5 8l5 4.5"/>
      </svg>
    </button>
  </div>

  <div id="program"></div>

  <!-- shown/labelled from config.js's padUrl - hidden entirely if a
       project sets none, see gas/README.md -->
  <button class="nav-item" data-view="pad" hidden>Collaborative Pad</button>

  <!-- what the program sends to the end, after the loose entries above -->
  <div id="program-end"></div>

  <!-- shown from config.js's resources - hidden entirely if a project
       sets none -->
  <button class="nav-item" data-view="resources" hidden>Resources</button>

  <!-- what the program sends past everything the framework adds: `at: "last"` -->
  <div id="program-last"></div>

  <!-- the whole program as one document: every deck, exercise and page, in
       the order this sidebar lists them. A browser cannot hand a page a PDF
       file, so this opens the print dialog and "Save as PDF" does the rest -
       which is what the title says, rather than promising a download. -->
  <button class="nav-item print-everything" id="print-everything"
          title="Lay the whole program out as one document and print it, or save it as a PDF">Print everything</button>
</nav>

<main>
  <section class="view" id="view-slides">
    <div class="stage">

<!-- build:decks -->

    </div>

    <div class="deck-bar">
      <button id="start">Start</button>
      <button id="prev">Previous</button>
      <span class="counter" id="counter"></span>
      <button id="next">Next</button>
      <button id="print-deck" class="print-deck" title="Print or save this presentation as a PDF">Print</button>
    </div>
  </section>

  <section class="view page" id="view-project" hidden>
<!-- build:projects -->
  </section>

<!-- build:views -->

  <!-- empty until "Print everything" fills it: every deck, exercise and page
       is moved in here for the print, and moved back when it is over -->
  <div id="print-all"></div>
</main>

<aside class="editor" id="editor" hidden>
  <div class="editor-head">
    <span class="editor-title-group">
      <button type="button" class="editor-minimize" id="editor-minimize"
              title="Minimize" aria-label="Minimize editor" aria-expanded="true">
        <svg class="icon-minimize" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor"
             stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
          <path d="M3 12h10"/>
        </svg>
        <svg class="icon-pencil" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor"
             stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M10.5 2.5 13.5 5.5 5.5 13.5 2 14l0.5-3.5Z"/>
          <path d="M9 4 12 7"/>
        </svg>
      </button>
      <strong>Editor</strong>
    </span>
    <span class="editor-buttons">
      <button type="button" id="clear-btn" title="Delete every note">Clear all</button>
      <button type="button" id="export-btn">Export</button>
    </span>
  </div>
  <div class="editor-body" id="editor-body">
    <label for="editor-title" id="editor-title-label">Current slide</label>
    <input type="text" id="editor-title" autocomplete="off">
    <textarea id="editor-comment" placeholder="Notes on this slide..."></textarea>
    <div class="editor-tools">
      <span class="tools-label">Draw</span>
      <button type="button" id="tool-line" aria-pressed="false"
              title="Drag across the slide to draw a red line">Line</button>
      <button type="button" id="tool-arrow" aria-pressed="false"
              title="Drag on the slide to point an arrow at something">Arrow</button>
      <button type="button" id="tool-rect" aria-pressed="false"
              title="Drag on the slide to draw a red box around something">Box</button>
      <button type="button" id="tool-text" aria-pressed="false"
              title="Click on the slide to write red text">Text</button>
      <button type="button" id="tool-undo" title="Remove the last drawing">Undo</button>
    </div>
    <div class="editor-actions">
      <button type="button" id="new-slide">New slide</button>
      <button type="button" id="del-slide" class="danger">Delete slide</button>
    </div>
    <!-- always available, unlike New/Delete slide above - a distinct class
         so it's untouched by the rule that dims .editor-actions for a
         section/solution (see style.css) -->
    <div class="editor-actions-all">
      <button type="button" id="edit-source">Edit source</button>
      <!-- the project's own default palette (config.js's GAS_CONFIG.palette) -
           options come from every <link data-palette> build.py's
           discover_palettes() found (see the <head>), nothing hand-listed
           here to keep in sync with that folder. Choosing one writes it
           straight into config.js (app.js), the same save dev.py's
           /api/source gives every other Edit source. -->
      <label class="palette-label" for="palette-select">Palette</label>
      <select id="palette-select" title="Project's palette" aria-label="Project's palette"></select>
    </div>
    <div class="editor-meta" id="editor-meta"></div>
  </div>
</aside>

<!-- ?mode=edit's "Edit source" - opens on a slide, a project/view, an
     exercise's own numbered step, or one of its solutions (see the inline
     "Edit" buttons app.js adds next to each in the rendered markdown).
     Talks to dev.py's /api/source - only there when the page is actually
     served by dev.py, not on a file:// open or the published site. -->
<dialog class="source-dialog" id="source-dialog">
  <div class="source-head">
    <strong id="source-title">Edit source</strong>
    <button type="button" class="solution-close" id="source-close">Close</button>
  </div>
  <div class="source-status" id="source-status" hidden></div>
  <!-- always editable (CodeJar, same as every code sample elsewhere on the
       page - see gas/assets/app.js), syntax-coloured as you type -->
  <pre class="source-raw"><code class="language-markup" id="source-raw-code"></code></pre>
  <div class="source-toolbar" id="source-toolbar">
    <button type="button" id="source-insert-code" title="Insert a code sample">Code sample</button>
    <button type="button" id="source-insert-diff" title="Insert a before/after solution block">Before/After</button>
    <button type="button" id="source-insert-link" title="Insert or edit a link">Link</button>
    <!-- only shown editing a slide (see app.js's openSourceEditor) - a new
         one, or every author's actual habit, a copy of the one open here -->
    <button type="button" id="source-insert-slide" title="Insert a new blank slide">New slide</button>
    <button type="button" id="source-copy-slide" title="Duplicate this slide, right after itself">Copy slide</button>
  </div>
  <div class="source-actions">
    <button type="button" id="source-cancel">Cancel</button>
    <button type="button" id="source-save" class="primary">Save</button>
  </div>
</dialog>

<!-- syntax colours for the code panels, vendored in assets/prism.js.
     manual: true, because app.js highlights each block itself once it has
     wired it up for editing, rather than racing Prism's own auto-run -->
<script>window.Prism = { manual: true };</script>
<script src="{{gas}}/assets/prism.js"></script>

<!-- renders the markdown embedded in the pages, vendored the same way -->
<script src="{{gas}}/assets/marked.js"></script>

<!-- makes the code panels editable in place, vendored the same way -->
<script src="{{gas}}/assets/codejar.js"></script>

<!-- computes a solution's before/after highlighting, vendored the same way -->
<script src="{{gas}}/assets/diff.js"></script>

<script src="{{gas}}/assets/app.js"></script>

</body>
</html>
